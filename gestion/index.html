<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNOX GYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#EEF1F7; --card:#FFFFFF; --tx:#10163A; --mut:#6B7194; --line:#E1E5F0;
  --side:#10163A; --sidetx:#C9CEE8; --acc:#FF6A1A; --acc2:#FF8A3D; --vio:#6B5BFF;
  --ok:#14A44D; --bad:#D93636; --inp:#F6F8FC;
  --font:'Plus Jakarta Sans','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C12; --card:#12151E; --tx:#EEF0F8; --mut:#8F95B2; --line:#232838;
    --side:#0E1118; --sidetx:#A9AFCB; --inp:#0B0E15; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C12; --card:#12151E; --tx:#EEF0F8; --mut:#8F95B2; --line:#232838;
  --side:#0E1118; --sidetx:#A9AFCB; --inp:#0B0E15; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.5}
[dir="rtl"] body, body.ar{font-family:'Tajawal','Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
[hidden]{display:none!important}
.cfh{background:none;border:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;padding:2px 4px;border-radius:6px;display:inline-flex;gap:3px;align-items:center}.cfh:hover{background:var(--inp)}.cfh.on{color:#ff6a13;background:rgba(255,106,19,.12)}.cfa{font-size:.8em;opacity:.7}.cfn{background:#ff6a13;color:#fff;border-radius:9px;padding:0 6px;font-size:.75em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-weight:600;min-height:20px}
.okmsg{color:var(--ok);font-weight:600}

/* login */
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.authcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-style:normal}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.link{background:none;border:0;color:var(--vio);cursor:pointer;font-weight:600;padding:0;text-align:start}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.shell.mini{grid-template-columns:72px 1fr}
.side{background:var(--side);color:var(--sidetx);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;width:100%;text-align:start;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.mini .nav span,.mini .logo b{display:none}
.mini .nav{justify-content:center}
.grow{flex:1}
.main{padding:20px 24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:24px;font-weight:800}
.top .sp{flex:1}
.who{font-size:12px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi small{color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dh h2{margin:0;font-size:22px}
.dk{position:relative;padding-inline-start:70px;min-height:76px;display:flex;flex-direction:column;justify-content:center}
.dk:hover{border-color:var(--acc)}
.dk-i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:color-mix(in srgb,var(--c) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.dk b{font-size:20px;white-space:nowrap}
@media(max-width:520px){.dk{padding-inline-start:58px;padding-inline-end:6px}.dk-i{inset-inline-start:10px;width:36px;height:36px;font-size:17px}.dk b{font-size:clamp(12px,3.9vw,16px);white-space:nowrap}}
.dkr{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dg-s2{font-size:13px;fill:var(--mut)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.dg{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.dg-t{font-size:22px;font-weight:800;fill:var(--tx)}.dg-s{font-size:10px;fill:var(--mut)}
.dg-l{display:flex;align-items:center;gap:8px;margin:5px 0;min-width:150px}.dg-l b{margin-inline-start:auto}
.dg-l i,.dg-lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dg-lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mut)}.dg-lg span{display:flex;align-items:center;gap:6px}
.dl{display:flex;flex-direction:column}
.dr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}.dr[data-open]{cursor:pointer}.dr[data-open]:hover{background:var(--inp)}
.dr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dr em{font-style:normal;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center;margin:7px 0}
.hb div{background:var(--inp);border-radius:99px;height:10px;overflow:hidden}.hb div i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px}
.gbar{background:#EC4899;border-radius:99px;height:10px;overflow:hidden}.gbar i{display:block;height:100%;background:#3B82F6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:180px;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:12px;color:var(--mut);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(20,164,77,.14);color:var(--ok)}
.pill.s{background:rgba(255,106,26,.14);color:var(--acc)}
.pill.l{background:rgba(217,54,54,.14);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.res{border-radius:14px;padding:18px;margin-bottom:14px;text-align:center;border:2px solid var(--line)}
.res.ok{border-color:var(--ok);background:rgba(20,164,77,.10)}
.res.ko{border-color:var(--bad);background:rgba(217,54,54,.10)}
.res h2{font-size:22px;font-weight:800;letter-spacing:.5px}
.res.ok h2{color:var(--ok)}.res.ko h2{color:var(--bad)}
#pa{display:none}
#pa .sxr table,#pa .sxr th,#pa .sxr td,#pa .sxd table,#pa .sxd th,#pa .sxd td{border:0;background:none;padding:0;margin:0;font-size:inherit;text-align:inherit}#pa .sxr table,#pa .sxd table{min-width:0!important;width:100%}#pa .sxr h1,#pa .sxr h2,#pa .sxr h3,#pa .sxd h1,#pa .sxd h2,#pa .sxd h3{margin:0;border:0}
#pa .sxr,#pa .sxr *{box-sizing:border-box;margin:0;padding:0}
#pa .sxr{font-family:Inter,Arial,sans-serif;color:#1f2937;background:#fff}
#pa .sxr .r{width:21cm;height:7cm;position:relative;overflow:hidden;display:grid;grid-template-columns:4.9cm minmax(0,1fr) 5.3cm;border:1.2px solid #14532d;border-radius:.15cm;background:#fff}
#pa .sxr .r .wm{position:absolute;left:50%;top:50%;width:5.4cm;transform:translate(-50%,-50%);opacity:.035;filter:grayscale(1);pointer-events:none}
#pa .sxr .sxside{background:#fff;color:#14532d;border-right:1.2px solid #14532d;padding:.32cm .34cm;display:flex;flex-direction:column;position:relative}
#pa .sxr .sxside::after{content:"";position:absolute;right:.08cm;top:.3cm;bottom:.3cm;width:1px;background:#b8923a}
#pa .sxr .brand{display:flex;gap:.22cm;align-items:center}
#pa .sxr .brand img{width:1.15cm;height:1.15cm;border-radius:50%}
#pa .sxr .brand b{display:block;font-size:10.5pt;letter-spacing:.4px;line-height:1.1}
#pa .sxr .brand span{font-size:7pt;letter-spacing:1.6px;color:#8a6d2b}
#pa .sxr .title{margin-top:.28cm;font-size:8.4pt;font-weight:800;letter-spacing:.3px;line-height:1.25}
#pa .sxr .season{font-size:7pt;color:#8a6d2b;margin-top:.05cm}
#pa .sxr .meta{margin-top:auto;display:flex;gap:.25cm;align-items:flex-end}
#pa .sxr .meta .qr{width:1.35cm;height:1.35cm}
#pa .sxr .meta .qr img{width:100%;height:100%}
#pa .sxr .meta div{font-size:6.6pt;color:#6b7280;line-height:1.5}
#pa .sxr .meta b{color:#111827;font-size:8.6pt;display:block;letter-spacing:.3px}
#pa .sxr .mid{padding:.26cm .38cm .22cm;display:flex;flex-direction:column;gap:.1cm;position:relative}
#pa .sxr .h{font-size:6.4pt;font-weight:800;letter-spacing:1.3px;color:#b8923a;border-bottom:1px solid #eadfc3;padding-bottom:.05cm}
#pa .sxr .kv{display:grid;grid-template-columns:auto 1fr;column-gap:.25cm;row-gap:.06cm;font-size:7.6pt;align-items:baseline}
#pa .sxr .kv i{font-style:normal;color:#6b7280;font-size:7pt}
#pa .sxr .kv b{font-weight:700;color:#111827;border-bottom:1px dotted #cbd5e1;min-height:.38cm}
#pa .sxr .two{display:grid;grid-template-columns:1fr 1fr;gap:.3cm}
#pa .sxr .mode{display:flex;gap:.3cm;font-size:7.4pt;align-items:center}
#pa .sxr .ck{display:inline-block;width:.28cm;height:.28cm;border:1px solid #14532d;border-radius:.05cm;vertical-align:-1px;margin-inline-end:.06cm;text-align:center;line-height:.26cm;font-size:7pt;color:#fff}
#pa .sxr .ck.on{background:#fff;color:#14532d;font-weight:800}
#pa .sxr .right{padding:.3cm .34cm .26cm;display:flex;flex-direction:column;gap:.14cm;border-left:1px dashed #d6c79f;position:relative}
#pa .sxr .amt{border:1.4px solid #14532d;border-radius:.16cm;padding:.12cm .2cm;background:#fff}
#pa .sxr .amt small{font-size:6.2pt;letter-spacing:1.2px;color:#14532d;font-weight:800}
#pa .sxr .amt b{display:block;font-size:17pt;color:#14532d;letter-spacing:.3px;line-height:1.15}
#pa .sxr .amt .rest{font-size:6.8pt;color:#6b7280}
#pa .sxr .words{font-size:6.8pt;color:#374151;line-height:1.35}
#pa .sxr .words b{color:#111827;font-style:italic}
#pa .sxr .sig{display:grid;grid-template-columns:1fr 1fr;gap:.2cm}
#pa .sxr .sig div{border:1px dashed #b8b8b8;border-radius:.1cm;height:1.05cm;font-size:6pt;color:#6b7280;padding:.06cm .1cm;letter-spacing:.4px}
#pa .sxr .copy{position:absolute;top:0;right:0;background:#fff;color:#8a6d2b;border-left:1px solid #b8923a;border-bottom:1px solid #b8923a;font-size:6pt;font-weight:800;letter-spacing:1.4px;padding:.06cm .22cm;border-bottom-left-radius:.12cm}
#pa .sxr .cut{height:0;border-top:1px dashed #9ca3af;position:relative}
#pa .sxr .cut span{position:absolute;left:.5cm;top:-.22cm;background:#fff;font-size:8pt;color:#6b7280;padding:0 .1cm}
#pa .sxr .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:.3cm}
#pa .sxr .next{align-self:flex-end;white-space:nowrap;background:#fff;border:1px solid #e6d29e;border-radius:.1cm;padding:.05cm .2cm;font-size:7pt;color:#7a5d1c}
#pa .sxr .next b{color:#14532d}
#pa .sxr .by{margin-top:auto;font-size:6.8pt;color:#6b7280}
#pa .sxr .by b{color:#14532d;letter-spacing:.5px}
#pa .sxr .soc{display:flex;gap:.18cm;align-items:center;border-left:1px solid #eadfc3;padding-left:.22cm}
#pa .sxr .soc img{width:1.05cm;height:1.05cm}
#pa .sxr .soc small{display:block;font-size:5.8pt;font-weight:800;letter-spacing:1.3px;color:#b8923a;margin-bottom:.03cm}
#pa .sxr .sl{display:grid;grid-template-columns:auto auto;column-gap:.18cm;flex:1}
#pa .sxr .sl small{grid-column:1/-1}
#pa .sxr .sl .w{grid-column:1/-1}
#pa .sxr .soc span{display:flex;gap:.07cm;align-items:center;font-size:6pt;color:#111827;line-height:1.5;white-space:nowrap}
#pa .sxr .qrw{display:flex;flex-direction:column;align-items:center;gap:.04cm}
#pa .sxr .qrw em{font-style:normal;font-size:5.4pt;letter-spacing:.3px;color:#6b7280;white-space:nowrap}
#pa .sxr .page{width:21cm;height:29.7cm;padding:.85cm 0;display:flex;flex-direction:column;justify-content:space-between;background:#fff}
#pa .sxd,#pa .sxd *{box-sizing:border-box;margin:0;padding:0}
#pa .sxd{font-family:Inter,Cairo,Arial,sans-serif;color:#1f2937;background:#fff}
#pa .sxd .ar{font-family:Cairo,sans-serif;direction:rtl}
#pa .sxd .v{width:21cm;height:14.8cm;position:relative;overflow:hidden;background:#fff;padding:.7cm .8cm .5cm;display:flex;flex-direction:column;outline:1px solid #d1d5db}
#pa .sxd .v::before{content:"";position:absolute;inset:.3cm;border:1.2px solid #14532d;border-radius:.2cm;pointer-events:none}
#pa .sxd .wm{position:absolute;left:50%;top:54%;width:7.5cm;transform:translate(-50%,-50%);opacity:.035;filter:grayscale(1)}
#pa .sxd .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4cm;padding-bottom:.25cm;border-bottom:1px solid #b8923a}
#pa .sxd .hd .l{display:flex;gap:.25cm;align-items:center}
#pa .sxd .hd .l img{width:1.35cm;height:1.35cm}
#pa .sxd .hd .l b{display:block;font-size:13pt;color:#14532d;letter-spacing:.5px;line-height:1.05}
#pa .sxd .hd .l span{font-size:7.5pt;letter-spacing:2px;color:#8a6d2b}
#pa .sxd .hd .r{text-align:right}
#pa .sxd .hd .r b{display:block;font-size:13pt;color:#14532d;font-weight:800;line-height:1.3}
#pa .sxd .hd .r span{font-size:8pt;color:#8a6d2b}
#pa .sxd .hd .c{text-align:center}
#pa .sxd .hd .c .t{font-size:13pt;font-weight:800;color:#14532d;letter-spacing:1px}
#pa .sxd .hd .c .ta{font-size:13pt;font-weight:800;color:#14532d}
#pa .sxd .hd .c small{display:block;font-size:7pt;color:#6b7280;letter-spacing:.5px}
#pa .sxd .sxtop{display:flex;justify-content:space-between;align-items:stretch;margin:.3cm 0 .15cm;gap:.4cm}
#pa .sxd .box{border:1px solid #cbd5e1;border-radius:.12cm;padding:.1cm .25cm;display:flex;flex-direction:column;justify-content:center;min-width:3.6cm}
#pa .sxd .box i{font-style:normal;font-size:6.5pt;color:#6b7280;display:flex;justify-content:space-between;gap:.3cm}
#pa .sxd .box b{min-height:.55cm;font-size:11pt;color:#111827;letter-spacing:.4px}
#pa .sxd .amt{border:1.5px solid #14532d;min-width:5.6cm}
#pa .sxd .amt b{min-height:.8cm;font-size:19pt;color:#14532d;line-height:1.1}
#pa .sxd .row{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:.25cm;margin-top:.2cm;font-size:8pt}
#pa .sxd .row>i{font-style:normal;color:#6b7280;white-space:nowrap}
#pa .sxd .row>i.ar{font-size:8.5pt}
#pa .sxd .row>b{border-bottom:1px dotted #94a3b8;min-height:.5cm;font-size:9.5pt;color:#111827;padding:0 .15cm;font-weight:700}
#pa .sxd .row>b em{font-style:italic}
#pa .sxd .two{display:grid;grid-template-columns:1fr 1fr;gap:.6cm}
#pa .sxd .mode{display:flex;align-items:center;gap:.22cm;margin-top:.28cm;font-size:8pt;flex-wrap:nowrap}
#pa .sxd .mode .ar{font-size:8.5pt;color:#374151}
#pa .sxd .ck{display:inline-block;width:.32cm;height:.32cm;border:1px solid #14532d;border-radius:50%;text-align:center;line-height:.3cm;font-size:7pt;color:#14532d;font-weight:800}
#pa .sxd .ln{display:inline-block;border-bottom:1px dotted #94a3b8;min-width:1.8cm;font-weight:700;color:#111827;padding:0 .1cm;font-size:9pt}
#pa .sxd .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:.35cm;margin-top:auto}
#pa .sxd .sig>div{border:1px dashed #b8b8b8;border-radius:.12cm;height:2.05cm;padding:.08cm .15cm;position:relative}
#pa .sxd .sig .h{display:flex;justify-content:space-between;font-size:7pt;font-weight:800;color:#374151;letter-spacing:.5px}
#pa .sxd .sig .h .ar{font-size:8pt}
#pa .sxd .sig small{display:flex;justify-content:space-between;font-size:6pt;color:#6b7280}
#pa .sxd .apv{position:absolute;right:.35cm;bottom:.12cm;border:1.4px solid #14532d;border-radius:.1cm;color:#14532d;font-size:7pt;font-weight:800;text-align:center;padding:.04cm .2cm;line-height:1.3;transform:rotate(-5deg);background:#fff}
#pa .sxd .ft{display:flex;align-items:center;gap:.4cm;margin-top:.22cm;padding-top:.15cm;border-top:1px solid #eadfc3;font-size:6.6pt;color:#4b5563}
#pa .sxd .ft .q{display:flex;align-items:center;gap:.12cm}
#pa .sxd .ft .q img{width:1.05cm;height:1.05cm}
#pa .sxd .ft .q span{font-size:5.6pt;line-height:1.3}
#pa .sxd .ft .c{flex:1;display:flex;flex-wrap:wrap;gap:.08cm .35cm}
#pa .sxd .ft .c span{display:inline-flex;align-items:center;gap:.08cm;white-space:nowrap}
#pa .sxd .ft .by{text-align:right;white-space:nowrap}
#pa .sxd .ft .by b{color:#14532d;letter-spacing:.5px;font-size:8pt}
#pa .sxd .tag{position:absolute;top:.3cm;right:1.2cm;border:1px solid #b8923a;border-top:0;border-radius:0 0 .12cm .12cm;padding:.03cm .25cm;font-size:6.2pt;font-weight:800;letter-spacing:1.3px;color:#8a6d2b;background:#fff}
#pa .sxd .p{width:14.8cm;height:21cm;position:relative;overflow:hidden;background:#fff;padding:.65cm .7cm .45cm;display:flex;flex-direction:column;outline:1px solid #d1d5db}

      rows.forEach(function(r){ if(match(r)) Object.assign(r,this.pl); },this);

    }

    return {data:out,count:out.length,error:null};
  };

function ageYM(b){
  if(!b) return null; var p=b.split('-').map(Number), n=new Date();
  var y=n.getFullYear()-p[0], m=(n.getMonth()+1)-p[1];
  if(n.getDate()<p[2]) m--; if(m<0){ y--; m+=12; }
  return y<0?null:{y:y,m:m};
}
function ageStrL(b){

  if(S.lang==='ar'){ var s=[]; if(a.y) s.push(a.y+' '+t('years')); if(a.m||!a.y) s.push(a.m+' '+t('monthsU')); return s.join(' و'); }
  var s2=[]; if(a.y) s2.push(a.y+' '+(a.y>1?'ans':'an')); if(a.m||!a.y) s2.push(a.m+' mois'); return s2.join(' ');
}
function refAge(b){
  if(!b) return null; var n=new Date(), by=+b.slice(0,4);
  if((S.cfg.cmode||'annee')==='exact'){ var a=ageYM(b); return a?a.y:null; }
  var sm=S.cfg.smonth||9, sy=(n.getMonth()+1>=sm)?n.getFullYear()+1:n.getFullYear();
  return sy-by;
}
function catOf(m){

}
function docList(m){
  var a=ageYM(m.birth_date), minor=a&&a.y<18, dd=m.docs||{}, td=todayStr();
  return DOCTYPES.filter(function(d){ return (!S.cfg.dtypes||S.cfg.dtypes.indexOf(d.id)>-1)&&(!d.min||minor); }).map(function(d){
    var x=dd[d.id], st='ok', txt=t('dOk');
    if(!x||!x.ok){ st='missing'; txt=t('dMissing'); }
    else if(d.exp){
      if(!x.exp){ st='missing'; txt=t('dNoExp'); }
      else if(x.exp<td){ st='expired'; txt=t('dExpired')+' '+x.exp; }
      else if(dayDiff(x.exp,td)<=30){ st='soon'; txt=t('dSoon')+' '+x.exp; }

  S.members=r.data||[]; S.membersErr=r.error?r.error.message:'';

  (sr.data||[]).forEach(function(x){ if(!S.lastEnd[x.member_id]||x.ends_on>S.lastEnd[x.member_id]) S.lastEnd[x.member_id]=x.ends_on; });
  S.msubs=sr.data||[];
  await loadCatalog();
  var pyr=await sb.from('payments').select('*'); S.bal=calcBal(sr.data||[],pyr.data||[]);
  var gr=await sb.from('groups').select('*').order('name'); S.groups=gr.data||[];
  var gm=await sb.from('group_members').select('*'); S.gm=gm.data||[];

S.adv={};
function advCount(){ var n=0; for(var k in S.adv){ if(S.adv[k]!==''&&S.adv[k]!=null) n++; } return n; }
function ageNow(b){ if(!b) return null; var d=new Date(b+'T00:00:00'), n=new Date(), a=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--; return a; }
function advOk(m){
  var A=S.adv, td=todayStr();
  if(A.sex && m.gender!==A.sex) return false;
  if(A.city && (m.city||'').trim().toLowerCase()!==A.city.trim().toLowerCase()) return false;
  if(A.status && m.status!==A.status) return false;
  if(A.grp && !(S.gm||[]).some(function(x){ return x.member_id===m.id && x.group_id===A.grp; })) return false;
  var subs=(S.msubs||[]).filter(function(x){ return x.member_id===m.id; });
  if(A.disc){ var pd={}; (S.plansAll||[]).forEach(function(p){ pd[p.id]=p.discipline_id; });
    if(!subs.some(function(x){ return pd[x.plan_id]===A.disc && x.ends_on>=td; })) return false; }
  if(A.debt && !((S.bal||{})[m.id]>0)) return false;
  if(A.sub && subState((S.lastEnd||{})[m.id])!==A.sub) return false;
  if(A.exp!==''&&A.exp!=null){ var e=(S.lastEnd||{})[m.id]; if(!e) return false; var dd=dayDiff(e,td); if(dd<0||dd>Number(A.exp)) return false; }
  var ag=ageNow(m.birth_date);
  if(A.amin!==''&&A.amin!=null){ if(ag==null||ag<Number(A.amin)) return false; }
  if(A.amax!==''&&A.amax!=null){ if(ag==null||ag>Number(A.amax)) return false; }
  if(A.j1 && (m.joined_on||'')<A.j1) return false;
  if(A.j2 && (m.joined_on||'')>A.j2) return false;
  if(A.inact!==''&&A.inact!=null){ var la=(S.lastAtt||{})[m.id]; if(la && dayDiff(td,la)<Number(A.inact)) return false; if(!la && !((S.lastEnd||{})[m.id])) return false; }
  return true;
}

async function loadPayments(){

  var pfl=await sb.from('pay_files').select('id,ref_type,ref_id,name,mime'); S.pfiles={}; (pfl.data||[]).forEach(function(x){ var k=x.ref_type+':'+x.ref_id; S.pfiles[k]=(S.pfiles[k]||0)+1; });

function validPayNoSt(p){ return p.status!=='cancelled'&&p.approval_state!=='pending'&&p.approval_state!=='rejected'; }
function payFiltered(){
  return (S.pays||[]).filter(function(p){
    return (S.pf.dir==='all'||p.direction===S.pf.dir) && (!S.pf.month || String(p.paid_on).slice(0,7)===S.pf.month);
  });
}
function payees(){ var o={}; (S.pays||[]).forEach(function(p){ if(p.kind!=='member'&&p.counterparty) o[p.counterparty]=1; }); return Object.keys(o).sort(); }
function payWho(p){ return p.kind==='member' ? (S.pnames[p.member_id]||'—') : (p.counterparty||'—'); }
/* ---- رقابة: الإلغاء المرقّم + غلق الصندوق + الأرقام الناقصة ---- */
function dayClosedSync(date){ return monthClosed(date)||(S.closings||[]).some(function(c){ return c.close_date===date&&!c.reopened_at; }); }
function cashNet(date){ /* espèces attendues = solde cumulé de la caisse à la fin de la journée (ouverture + opérations espèces + mouvements banque↔caisse) */
  var op=(S.cfg&&S.cfg.opening)||{cash:0,date:''}, mv=(S.cfg&&S.cfg.cashmoves)||[], a=op.cash||0, n=0;
  (S.pays||[]).forEach(function(p){ if(p.method!=='cash'||!validPay(p)||p.paid_on>date) return; if(op.date&&p.paid_on<op.date) return; a+=(p.direction==='in'?1:-1)*Number(p.amount_millimes); if(p.paid_on===date) n++; });
  mv.forEach(function(m){ if(m.date>date||(op.date&&m.date<op.date)) return; a+=(m.dir==='c2b'?-1:1)*m.amt; if(m.date===date) n++; });
  return {a:a,n:n}; }
function seqGaps(){
  var seqs=(S.pays||[]).map(function(p){ return p.receipt_seq; }).filter(Boolean), set={}; seqs.forEach(function(x){ set[x]=1; });
  var mx=seqs.reduce(function(a,b){ return Math.max(a,b); },0), miss=[]; for(var i=1;i<=mx;i++) if(!set[i]) miss.push(i); return {miss:miss,max:mx};
}
function voidMk(p){ return p&&p.status==='cancelled'?'<div class="void">'+GL('ANNULÉ','ملغى')+'</div>':''; }
function isMgrFin(){ return canFin(); }

function mvHasDoc(m){ return !!(m.ref||m.nodoc||(S.pfiles&&S.pfiles['move:'+m.id])); }
function recDue(){ var rc=(S.cfg&&S.cfg.recurring)||[], ym=todayStr().slice(0,7), dd=parseInt(todayStr().slice(8,10),10); return rc.filter(function(r){ return (r.day||1)<=dd && !recDone(r,ym); }); }
function recDone(r,ym){ var tag='rec:'+r.id+':'+ym; return (S.pays||[]).some(function(p){ return p.notes===tag&&p.status!=='cancelled'; }); }

async function doScan(raw){
  var v=String(raw||'').trim().toUpperCase(); if(!v) return;
  var mm=v.match(/GM\s*0*(\d{1,7})/)||(/^\d{1,7}$/.test(v)?[v,v]:null); if(mm) v='GM'+String(mm[1]).padStart(5,'0');
  var code=parseInt(v.replace(/^GM/,''),10), m=isNaN(code)?null:(S.gmembers||[]).filter(function(x){ return x.code===code; })[0];
  var today=todayStr();
  if(!m){ S.last={ok:false,msg:t('unknownCode')+' : '+v}; return finishScan(); }
  var sr=await sb.from('subscriptions').select('*').eq('member_id',m.id), subs=sr.data||[];
  var cur=subs.filter(function(x){ return x.starts_on<=today&&x.ends_on>=today; }).sort(function(a,b){ return b.ends_on.localeCompare(a.ends_on); })[0];
  if(m.status==='suspended'){ S.last={ok:false,m:m,msg:t('suspendedM')}; return finishScan(); }
  if(m.status==='left'){ S.last={ok:false,m:m,msg:t('leftM')}; return finishScan(); }
  if(!cur){ S.last={ok:false,m:m,msg:subs.length?t('subExpired'):t('noSub')}; return finishScan(); }
  var plan=S.plansAll.filter(function(p){return p.id===cur.plan_id;})[0];
  var ar=await sb.from('attendance').select('*').eq('member_id',m.id), rows=ar.data||[];
  var todayRow=rows.filter(function(x){ return x.att_date===today; })[0];
  var prev=rows.filter(function(x){ return x.att_date<today; }).reduce(function(a,x){ var d=Date.parse(x.created_at)||0; return d>a?d:a; },0)||0;
  var solde=0;
  if(S.profile.role!=='coach' && plan){
    var pr=await sb.from('payments').select('*').eq('member_id',m.id);
    var paid=(pr.data||[]).filter(function(p){ return p.subscription_id===cur.id && p.status!=='cancelled' && p.status!=='bounced'; }).reduce(function(a,p){ return a+Number(p.amount_millimes); },0);
    solde=subDue(cur,plan)-paid;
  }
  var docs=docList(m).filter(function(x){ return x.st==='missing'||x.st==='expired'; }).map(function(x){ return docName(x.d); });
  if(S.cfg.blockdoc && docs.length){ S.last={ok:false,m:m,msg:GL('Dossier incomplet : ','الملف ناقص: ')+docs.join(', ')}; return finishScan(); }
  var res={ok:true,m:m,sub:cur,plan:plan,prev:prev,solde:solde,docs:docs};
  if(todayRow){ res.warn=t('alreadyIn')+' '+hhmm(todayRow.created_at); }
  else{
    var gm=await sb.from('group_members').select('*').eq('member_id',m.id), gids=(gm.data||[]).map(function(x){return x.group_id;});
    var mg=S.groups.filter(function(x){ return gids.indexOf(x.id)>-1 && plan && x.discipline_id===plan.discipline_id; });
    var g=mg[0];
    var sc=slotCheck(mg);
    if(sc.out){

var DORDER=[1,2,3,4,5,6,0];
function slotsOf(g){
  var s=(g&&g.schedule)||{};
  if(s.slots&&s.slots.length) return s.slots;
  if(s.days&&s.days.length&&s.start) return [{days:s.days,start:s.start,end:s.end||'',room:''}];
  return [];
}
function daysStr(days){
  var idx=DORDER.map(function(d){ return days.indexOf(d)>-1; }), out=[], i=0;
  while(i<7){
    if(!idx[i]){ i++; continue; }
    var j=i; while(j+1<7&&idx[j+1]) j++;
    if(j-i>=2) out.push(dayName(DORDER[i])+'–'+dayName(DORDER[j])); else for(var k=i;k<=j;k++) out.push(dayName(DORDER[k]));
    i=j+1;
  }
  return out.join(' · ');
}
function schedStr(g){
  return slotsOf(g).map(function(sl){ return daysStr(sl.days||[])+' \u2066'+sl.start+(sl.end?'–'+sl.end:'')+'\u2069'+(sl.room?' ('+sl.room+')':''); }).join(' | ');
}

function bindBackup(){
  if(!$('bkOut')) return;
  var msg=function(x){ $('bkMsg').textContent=x; };
  $('bkOut').onclick=async function(){
    var out={app:'SYNOX GYM',version:1,date:new Date().toISOString(),tables:{}};
    for(var i=0;i<BK_TABLES.length;i++){ var r=await sb.from(BK_TABLES[i]).select('*'); out.tables[BK_TABLES[i]]=r.data||[]; }
    dlBlob('synox-backup-'+todayStr()+'.json',JSON.stringify(out),'application/json');
    store('lastBackup',new Date().toLocaleString()); msg(GL('Sauvegarde téléchargée. Gardez le fichier en lieu sûr (clé USB, Drive).','تم تنزيل النسخة. احتفظ بالملف في مكان آمن (فلاش أو Drive).'));
  };
  $('bkIn').onclick=function(){ $('bkFile').click(); };
  $('bkFile').onchange=async function(){
    var f=$('bkFile').files[0]; if(!f) return; var data;
    try{ data=JSON.parse(await f.text()); if(data.app!=='SYNOX GYM'||!data.tables) throw 0; }catch(e){ msg(GL('Fichier invalide.','الملف غير صالح.')); return; }
    if(!await uiConfirm(DEMO?GL('Toutes les données actuelles seront remplacées par cette sauvegarde.','ستُستبدل كل البيانات الحالية بهذه النسخة.'):GL('Seules les données absentes seront ajoutées ; rien n\'est effacé.','ستُضاف البيانات المفقودة فقط، ولن يُحذف شيء.'),{title:GL('Restaurer la sauvegarde ?','استرجاع النسخة الاحتياطية؟'),danger:DEMO,icon:'upload',ok:GL('Restaurer','استرجاع')})) return;
    if(!await guardAsk()) return;
    var n=0, errs=[];
    if(DEMO){ BK_TABLES.forEach(function(tb){ if(!(tb in data.tables)) return; try{ localStorage.setItem('synox_vide3_'+tb,JSON.stringify(data.tables[tb]||[])); n+=(data.tables[tb]||[]).length; }catch(e){ errs.push(tb); } }); }
    else{
      for(var i=0;i<BK_TABLES.length;i++){ var tb=BK_TABLES[i], rows=data.tables[tb]||[], key=tb==='app_settings'?'key':'id';
        var ex=await sb.from(tb).select(key), have={}; (ex.data||[]).forEach(function(x){ have[x[key]]=1; });
        var todo=rows.filter(function(x){ return !have[x[key]]; });
        for(var j=0;j<todo.length;j+=100){ var r=await _rawFrom(tb).insert(todo.slice(j,j+100)); if(r.error){ errs.push(tb+': '+r.error.message); break; } n+=Math.min(100,todo.length-j); } }
    }
    msg((errs.length?GL('Erreurs : ','أخطاء: ')+errs.join(' | ')+' — ':'')+n+' '+GL('enregistrements restaurés.','سجل تمت استعادته.'));
    if(!errs.length) setTimeout(function(){ loadView(); },900);
  };
}

function shrinkPng(file,max){
  return new Promise(function(res,rej){
    var im=new Image(), u=URL.createObjectURL(file);
    im.onload=function(){ var k=Math.min(1,max/Math.max(im.width,im.height)), w=Math.round(im.width*k), h=Math.round(im.height*k), c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/png')); };
    im.onerror=function(){ rej(new Error('image')); }; im.src=u;
  });
}

function wordsAr(n){
  var ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  var tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'], hun=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function b1000(x){ var p=[], h=Math.floor(x/100), r=x%100; if(h) p.push(hun[h]); if(r){ if(r<20) p.push(ones[r]); else{ if(r%10) p.push(ones[r%10]); p.push(tens[Math.floor(r/10)]); } } return p.join(' و'); }
  if(n===0) return 'صفر';
  var out=[], m=Math.floor(n/1e6), th=Math.floor((n%1e6)/1000), r=n%1000;
  if(m){ out.push(m===1?'مليون':m===2?'مليونان':(m<=10?b1000(m)+' ملايين':b1000(m)+' مليونا')); }
  if(th){ out.push(th===1?'ألف':th===2?'ألفان':(th<=10?b1000(th)+' آلاف':b1000(th)+' ألفا')); }
  if(r) out.push(b1000(r));

}
function wordsFr(n){
  var u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'], t=['','','vingt','trente','quarante','cinquante','soixante'];
  function b100(x,fin){ if(x<20) return u[x]; if(x<70){ var a=t[Math.floor(x/10)], b=x%10; return b===0?a:(b===1?a+' et un':a+'-'+u[b]); } if(x<80){ var c=x-60; return c===11?'soixante et onze':'soixante-'+u[c]; } if(x===80) return fin?'quatre-vingts':'quatre-vingt'; return 'quatre-vingt-'+u[x-80]; }
  function b1000(x,fin){ var h=Math.floor(x/100), r=x%100; if(!h) return b100(r,fin); var s=(h===1?'cent':u[h]+' cent'); if(!r) return s+((h>1&&fin)?'s':''); return s+' '+b100(r,fin); }
  if(n===0) return 'zéro';
  var out=[], m=Math.floor(n/1e6), th=Math.floor((n%1e6)/1000), r=n%1000;
  if(m) out.push(b1000(m,0)+(m>1?' millions':' million'));
  if(th) out.push(th===1?'mille':b1000(th,0)+' mille');
  if(r) out.push(b1000(r,1));

}

function impDate(v){

async function impRead(file){
  var name=file.name||'', rows;
  if(/\.(csv|txt)$/i.test(name)) rows=impParseText(await file.text());

    if(!window.XLSX) throw new Error(GL('Lecture Excel indisponible hors ligne : enregistrez le fichier en CSV (Fichier > Enregistrer sous > CSV) puis réessayez.','قراءة Excel غير متاحة دون إنترنت: احفظ الملف بصيغة CSV (حفظ باسم ← CSV) ثم أعد المحاولة.'));
    var wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}), ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
  }
  if(rows.length<2) throw new Error(GL('Fichier vide ou sans données.','الملف فارغ أو بلا بيانات.'));
  var headers=rows[0].map(function(x){ return String(x==null?'':x).trim(); });
  return {fname:name,headers:headers,data:rows.slice(1),map:impAuto(headers),grp:'',msg:''};
}

        var vs=c.uniq.slice().sort(function(a,b){ return a.localeCompare(b,S.lang==='ar'?'ar':'fr',{numeric:true}); });

          vs.map(function(v){ return '<label class="cfi" style="display:flex;gap:8px;align-items:center;padding:4px 2px"><input type="checkbox" data-cv="'+esc(v)+'"'+(!f.sel||f.sel.indexOf(v)>-1?' checked':'')+'><span style="flex:1">'+(v===''?'—':esc(v))+'</span><span class="who">'+(cnt[v]||0)+'</span></label>'; }).join(''); }
      h+='<div style="display:flex;justify-content:space-between;margin-top:8px"><button type="button" class="btn sm" data-cfc="1">'+GL('Effacer le filtre','مسح الفلتر')+'</button><button type="button" class="btn sm pri" data-cfok="1">'+GL('Fermer','إغلاق')+'</button></div>';
      p.innerHTML=h; document.body.appendChild(p); p.onmousedown=function(e){ e.stopPropagation(); };
      p.querySelectorAll('[data-cs]').forEach(function(b){ b.onclick=function(){ var d=b.getAttribute('data-cs'); st.sort=(so&&st.sort.d===d)?null:{i:ci,d:d}; apply(); pop(ci,btn); }; });
      p.querySelector('[data-cfc]').onclick=function(){ delete st.f[ci]; apply(); pop(ci,btn); }; p.querySelector('[data-cfok]').onclick=cfPopClose;
      if(c.num){ var ch=function(){ st.f[ci]={min:p.querySelector('#tMin').value,max:p.querySelector('#tMax').value}; apply(); }; p.querySelector('#tMin').oninput=ch; p.querySelector('#tMax').oninput=ch; }
      else if(c.text){ var tt=p.querySelector('#tTxt'); tt.oninput=function(){ st.f[ci]={txt:tt.value.trim()}; apply(); }; tt.focus(); }
      else{ var bx=function(){ return [].slice.call(p.querySelectorAll('[data-cv]')); }, all=p.querySelector('#tAll');
        var go=function(){ var b=bx(), on=b.filter(function(x){return x.checked;}).map(function(x){return x.getAttribute('data-cv');}); if(on.length===b.length) delete st.f[ci]; else st.f[ci]={sel:on.length?on:['\u0000']}; all.checked=on.length===b.length; apply(); };
        bx().forEach(function(x){ x.onchange=go; }); all.checked=!st.f[ci]||!st.f[ci].sel;
        all.onchange=function(){ bx().forEach(function(x){ if(x.parentNode.style.display!=='none') x.checked=all.checked; }); go(); };
        p.querySelector('#tSrch').oninput=function(){ var q=this.value.toLowerCase(); p.querySelectorAll('.cfi').forEach(function(l){ l.style.display=l.textContent.toLowerCase().indexOf(q)>-1?'flex':'none'; }); }; }
    }
    ths.forEach(function(th,i){ var b=th.querySelector('.cfh'); if(!b) return; b.onmousedown=function(e){ e.stopPropagation(); }; b.onclick=function(e){ e.stopPropagation(); if($('cfpop')&&$('cfpop').getAttribute('data-k')==='t'+i){ cfPopClose(); return; } pop(i,b); }; });
    apply();
  });
}
function render(){
  applyLook();
  if(!S.user){ renderAuth(); return; }
  if(!S.profile || !S.profile.active){ renderWait(); return; }
  var title=S.view==='member'?(S.member?S.member.first_name+' '+S.member.last_name:t('members')):(S.view==='coach'?t('coaches'):vT(S.view));
  var inner = S.view==='dash'?dashHtml(): S.view==='members'?membersHtml(): S.view==='users'?usersHtml(): S.view==='parents'?parentsHtml(): S.view==='account'?accountHtml(): S.view==='member'?memberHtml(): S.view==='settings'?settingsHtml(): S.view==='attendance'?attendanceHtml(): S.view==='groups'?groupsHtml(): S.view==='coaches'?coachesHtml(): S.view==='coach'?coachHtml(): S.view==='reports'?reportsHtml(): S.view==='journal'?journalHtml(): S.view==='planning'?planningHtml(): S.view==='progress'?progressHtml(): S.view==='achievements'?achHtml(): S.view==='messages'?messagesHtml(): paymentsHtml();
  $('app').innerHTML=shell(title,inner);
  bindShell();
  if($('demoRole')) $('demoRole').onchange=async function(){ await _rawFrom('profiles').update({role:$('demoRole').value}).eq('id',S.user.id); S.view='dash'; await boot(); };
  if(S.view==='members') bindMembers();
  if(S.view==='parents') bindParents(); if(S.view==='users') bindUsers(); if(S.view==='account') bindAccount();
  if(S.view==='member') bindMember();
  if(S.view==='settings') bindSettings();
  if(isFinV(S.view)) bindPayments();
  if(S.view==='salaries') bindCoaches();
  if(S.view==='unpaid'||S.view==='finrep') bindReports();
  if(S.view==='compta') bindCompta();
  document.querySelectorAll('[data-cslip]').forEach(function(b){ b.onclick=function(){ printPayslip(coachOf(b.getAttribute('data-cslip')),cpMonth()); }; });
  document.querySelectorAll('[data-fgo]').forEach(function(b){ b.onclick=function(){ S.view=b.getAttribute('data-fgo'); S.modal=''; loadView(); }; });
  if($('frMonthGo')) $('frMonthGo').onclick=function(){ printFinMonth($('frMonth').value||todayStr().slice(0,7)); };
  if(S.view==='attendance') bindAttendance();
  if(S.view==='groups') bindGroups();
  if(S.view==='coaches') bindCoaches();
  if(S.view==='coach') bindCoach();
  if(S.view==='reports') bindReports();
  if(S.view==='journal') bindJournal();
  if(S.view==='planning') bindPlanning();
  if(S.view==='progress') bindProgress();
  if(S.view==='achievements') bindAch();
  if(S.view==='messages') bindMessages();
  if(S.view==='dash') bindDash();
  bindModal();
  try{ enhanceTables(); }catch(e){ console.error(e); }
}

applyLook();
boot().catch(function(e){ renderAuth(String(e&&e.message||e)); });
})();
</script>
