<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>SYNOX GYM</title>
<meta name="theme-color" content="#17171B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column (max 480px), page scrolls, fixed bottom nav per role; dark-first, orange accent */
:root{
  --bg:#141416; --surface:#1E1F23; --surface2:#2A2B30; --line:#2E2F35;
  --fg:#F2F0EC; --muted:#A3A3A8; --faint:#8C8C93;
  --accent:#FF6B1A; --accent-ink:#141416; --accent-text:#FF9A5C; --accent-soft:#2A1A10; --accent-line:#5A2E12;
  --ok:#34C759; --ok-text:#6FE39A; --ok-soft:#16261B;
  --bad:#FF5A5F; --bad-text:#FF8A8E; --bad-soft:#241616; --bad-line:#5A2E2E;
  --warn:#F5B700; --warn-text:#FFD34D; --warn-soft:#2A2410;
  --info:#5AA9FF; --info-text:#8EC5FF; --info-soft:#142233;
  --nav:#18191C; --toast-bg:#F2F0EC; --toast-fg:#141416; --scrim:rgba(0,0,0,.6);
  --font:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F4F0; --surface:#FFFFFF; --surface2:#EFECE6; --line:#E2DED7;
  --fg:#1A1A1C; --muted:#5E5E66; --faint:#6E6E76;
  --accent:#FF6B1A; --accent-ink:#141416; --accent-text:#B84505; --accent-soft:#FFEADC; --accent-line:#F6C3A0;
  --ok:#2FB350; --ok-text:#1E7A3E; --ok-soft:#E3F5E8;
  --bad:#F0484E; --bad-text:#B4232A; --bad-soft:#FDE8E8; --bad-line:#F3B9BB;
  --warn:#F0B000; --warn-text:#8A5A00; --warn-soft:#FFF4D6;
  --info:#3E8FE8; --info-text:#1F4E85; --info-soft:#E3EEFB;
  --nav:#FFFFFF; --toast-bg:#1A1A1C; --toast-fg:#F6F4F0; --scrim:rgba(20,20,22,.45); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface2:#EFECE6; --line:#E2DED7;
  --fg:#1A1A1C; --muted:#5E5E66; --faint:#6E6E76;
  --accent:#FF6B1A; --accent-ink:#141416; --accent-text:#B84505; --accent-soft:#FFEADC; --accent-line:#F6C3A0;
  --ok:#2FB350; --ok-text:#1E7A3E; --ok-soft:#E3F5E8;
  --bad:#F0484E; --bad-text:#B4232A; --bad-soft:#FDE8E8; --bad-line:#F3B9BB;
  --warn:#F0B000; --warn-text:#8A5A00; --warn-soft:#FFF4D6;
  --info:#3E8FE8; --info-text:#1F4E85; --info-soft:#E3EEFB;
  --nav:#FFFFFF; --toast-bg:#1A1A1C; --toast-fg:#F6F4F0; --scrim:rgba(20,20,22,.45); color-scheme:light;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.app.with-bar{padding-bottom:200px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hot{border-color:var(--accent)}
.card.tight{padding:14px;gap:8px;border-radius:16px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-text)} .pill.bad{background:var(--bad-soft);color:var(--bad-text)}
.pill.info{background:var(--info-soft);color:var(--info-text)} .pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn-text)}
.dot{width:8px;height:8px;border-radius:4px;background:currentColor;display:inline-block}
.btn{min-height:50px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:600}
.btn.danger{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad-text);font-size:14px;min-height:44px}
.btn.okfill{background:var(--ok);color:#0B1A10}
.btn.okline{background:transparent;border:1px solid var(--ok);color:var(--ok-text);width:auto;min-height:40px;font-size:14px;border-radius:20px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btns.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;min-height:44px;padding:0 4px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-size:14px;font-weight:500;color:var(--muted)}
.input{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px;width:100%}
select.input{appearance:auto}
textarea.input{padding:12px 16px;min-height:76px;resize:none}
.input::placeholder{color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:14px;background:var(--surface)}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.count{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px}
.count b{font-size:20px;line-height:1.3}
.count span{font-size:12px}
.c-p{background:var(--ok-soft);color:var(--ok-text)} .c-a{background:var(--bad-soft);color:var(--bad-text)}
.c-l{background:var(--warn-soft);color:var(--warn-text)} .c-e{background:var(--info-soft);color:var(--info-text)}
.athlete{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.marks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.marks button{min-height:44px;border-radius:12px;border:0;background:var(--surface2);color:var(--faint);font-weight:700;font-size:16px}
.marks button[aria-pressed="true"].m-p{background:var(--ok);color:#0B1A10}
.marks button[aria-pressed="true"].m-a{background:var(--bad);color:#1A0B0B}
.marks button[aria-pressed="true"].m-l{background:var(--warn);color:#1A1400}
.marks button[aria-pressed="true"].m-e{background:var(--info);color:#0B1420}
.marks button:disabled{cursor:default}
.badge{align-self:flex-start;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.6}
.banner.accent{background:var(--accent-soft);border:1px solid var(--accent-line)}
.banner.bad{background:var(--bad-soft);border:1px solid var(--bad-line)}
.banner.warn{background:var(--warn-soft);color:var(--warn-text)}
.banner.info{background:var(--surface2);color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots span{flex:1 1 0;height:10px;border-radius:5px}
.s-p{background:var(--ok)} .s-a{background:var(--bad)} .s-l{background:var(--warn)} .s-e{background:var(--info)} .s-n{background:var(--surface2)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:4px;display:inline-block}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden}
.list>*{min-height:52px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--surface2)}
.list>*:last-child{border-bottom:0}
.list button.item{background:transparent;border:0;border-bottom:1px solid var(--surface2);width:100%;text-align:start;font-size:15px}
.switch{width:48px;height:28px;border-radius:14px;background:var(--surface2);border:0;position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:11px;background:var(--muted);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:23px;background:var(--accent-ink)}
.mini-seg{display:flex;gap:6px;flex-wrap:wrap}
.mini-seg button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.mini-seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav.tabs button{background:none;border:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;position:relative;line-height:1.2;text-align:center}
nav.tabs button[aria-current="page"]{color:var(--accent-text);font-weight:600}
nav.tabs .badge-n{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.actionbar{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.actionbar .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:500;line-height:1.6;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.logo{width:76px;height:76px;border-radius:22px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.wordmark{font-size:26px;font-weight:700;letter-spacing:3px;direction:ltr}
.demo{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.demo-accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.demo-accs button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 10px;text-align:start}
.demo-accs b{font-size:13px;color:var(--fg)}
.demo-accs code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.err{color:var(--bad-text);font-size:14px}
.news{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok-text)} .amt.out{color:var(--bad-text)}
.line{height:1px;background:var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:130px;padding-top:6px}
.chart .m{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .pair{display:flex;gap:3px;align-items:flex-end;height:100px;width:100%;justify-content:center}
.chart .pair span{width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.chart .lb{font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.icon-btn{position:relative}
.icon-btn .cnt{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6}
.notif.unread{border-color:var(--accent-line);background:var(--accent-soft)}
.ndot{width:10px;height:10px;border-radius:5px;flex-shrink:0;margin-top:7px}
.daylbl{font-size:14px;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.pa-hero{border-radius:24px;background:#17171B;color:#F4F2EE;padding:18px;display:flex;flex-direction:column;gap:14px}
.pa-ava{display:inline-flex;align-items:center;justify-content:center;background:#FF6A13;color:#17171B;font-weight:700}
.pa-dark-btn{min-height:44px;padding:0 14px;border-radius:14px;border:0;background:#2A2A30;color:#F4F2EE;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.pa-dark-btn svg{color:#FF6A13}
.pa-card{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:16px;color:var(--fg);width:100%}
button.pa-card{font:inherit;cursor:pointer}
.pa-date{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.pa-icon{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text);flex-shrink:0}
.pa-news{border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pa-pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
.pa-pill.on{border:2px solid #FF6A13;background:var(--surface);color:var(--fg);font-weight:600}
.pa-path{display:flex;align-items:center}
.pa-step{width:34px;height:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;font-size:14px;background:var(--surface2);color:var(--muted)}
.pa-step.done{background:#FF6A13;color:#1E1B18}.pa-step.done svg{width:16px;height:16px}
.pa-step.cur{width:40px;height:40px;border-radius:20px;background:#17171B;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 0 0 4px var(--accent-soft)}
.pa-line{flex:1;height:4px;background:var(--line)}.pa-line.on{background:#FF6A13}
.banner.ok-b{background:var(--ok-soft);color:var(--ok-text)}
.pa-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.pa-wk{font-size:11px;color:var(--muted)}
.pa-day{height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.pa-day.s-p,.pa-day.s-l{background:#2E9E57;color:#FFFFFF;font-weight:700}.pa-day.s-a{background:#D93838;color:#FFFFFF;font-weight:700}.pa-day.s-e{background:#3B82C4;color:#FFFFFF;font-weight:700}
.pa-day.fut{border:2px solid #FF6A13;color:var(--accent-text);font-weight:700}
.pa-key{width:12px;height:12px;border-radius:4px;display:inline-block}.pa-key.s-p{background:#2E9E57}.pa-key.s-a{background:#D93838}.pa-key.s-e{background:#3B82C4}.pa-key.fut{border:2px solid #FF6A13}
.pa-badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pa-badge{width:60px;height:60px;border-radius:30px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);border:2px dashed var(--line);color:var(--faint)}
.pa-badge.on{background:var(--accent-soft);border:2px solid #FF6A13;color:var(--accent-text)}
.list button.item.between{display:flex;justify-content:space-between;align-items:center;width:100%}
.sx-splash{position:fixed;inset:0;background:#17171B;color:#F4F2EE;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 32px 56px;z-index:50}
.sx-name{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1;direction:ltr}.sx-name span{color:#FF6A13}
.sx-ar{font-size:20px;font-weight:800;color:#A9A6A0}.sx-club{font-size:12px;color:#A9A6A0;letter-spacing:1px;direction:ltr}
.sx-track{width:120px;height:4px;border-radius:2px;background:#2E2E34;overflow:hidden}.s-bar{height:4px;border-radius:2px;background:#FF6A13;width:120px;animation:sBar 1.2s ease-in-out both}
.s-draw{stroke-dasharray:200;animation:sDraw .7s ease-in-out both}
.s-plate{transform-box:fill-box;transform-origin:center;animation:sPlate .5s ease-out .55s both}
.s-text{animation:sText .5s ease-out .6s both}
@keyframes sDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes sPlate{0%{transform:scale(0);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sText{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes sBar{from{width:0}to{width:120px}}
@media (prefers-reduced-motion: reduce){.s-draw,.s-plate,.s-text,.s-bar{animation:none}}
.stars{display:inline-flex;gap:2px;align-items:center}.st-on{fill:#FF6A13}.st-off{fill:var(--surface2)}
.star-btn{background:none;border:0;padding:4px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pa-quote{line-height:1.75;font-weight:500;white-space:pre-wrap}
.pa-card.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chk{display:flex;gap:12px;align-items:flex-start;text-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--fg);font:inherit;line-height:1.6;cursor:pointer;width:100%}
.chk .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.chk[aria-pressed="true"] .box{background:#FF6A13;border-color:#FF6A13}.chk .box svg{width:16px;height:16px}
label.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pill svg{width:14px;height:14px}.btn svg{flex-shrink:0}
.wk{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.wk-hd{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);font-size:11px;text-align:center}
.wk-hd>span{display:flex;flex-direction:column;padding:6px 0;color:var(--muted)}.wk-hd>span b{font-weight:600}.wk-hd>span.td{color:var(--accent-text)}
.wk-bd{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr));position:relative}
.wk-hr>span{display:block;font-size:10px;color:var(--muted);text-align:center;border-top:1px dashed var(--line);box-sizing:border-box;padding-top:2px}
.wk-col{position:relative;border-inline-start:1px solid var(--line)}.wk-col.td{background:var(--accent-soft)}
.wk-b{position:absolute;inset-inline:2px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:1.2;padding:3px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.wk-b b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wk-b.off{background:var(--bad-soft);color:var(--bad-text);text-decoration:line-through}.wk-b.mv{background:var(--info-soft);color:var(--info-text)}
.mc{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:8px}
.mc-hd,.mc-bd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.mc-hd span{font-size:12px;color:var(--muted);padding:4px 0}
.mc-d{min-height:46px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.mc-d.out{opacity:.3}.mc-d.td{border-color:var(--accent)}.mc-d.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mc-dots{display:flex;gap:2px;height:6px}.mc-dots i{width:5px;height:5px;border-radius:3px;background:var(--accent)}.mc-d.sel .mc-dots i{background:var(--accent-ink)}.mc-dots i.x{background:var(--bad)}

/* ---------- Offline queue (coach attendance) ---------- */
function outbox(){return load('sxm-outbox')||[]}
function setOutbox(o){store('sxm-outbox',o)}
async function flush(){
  var o=outbox();if(!o.length||!isOnline())return;var left=[],n=0;
  for(var i=0;i<o.length;i++){try{await rpc(o[i].fn,o[i].args);n++}catch(e){left.push(o[i])}}
  setOutbox(left);if(n)toast(L()?n+' envoi(s) effectué(s).':'أُرسلت '+n+' عملية محفوظة.');
}

  catch(e){var m=String(e&&e.message||'');if(!isOnline()||/Failed to fetch|NetworkError|network/i.test(m)){var o=outbox();o.push({fn:fn,args:args});setOutbox(o);return {ok:true,queued:true}}throw e}

/* ---------- Schedule ---------- */
function slotsOf(g){var s=g.schedule||{};return Array.isArray(s.slots)?s.slots:[]}
function hhmm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function daySlots(g,date){var dow=parseYmd(date).getDay();return slotsOf(g).filter(function(sl){return (sl.days||[]).map(Number).indexOf(dow)>=0}).sort(function(a,b){return mins(a.start)-mins(b.start)})}
function slotDur(g,date){var sl=daySlots(g,date)[0];return sl?Math.max(30,mins(sl.end)-mins(sl.start)):90}
function movesList(){return S.role==='parent'?((S.feed&&S.feed.requests)||[]):(S.weekReq||[])}
/* حصص يوم: حصص المجموعة في نفس اليوم تُجمع في بطاقة واحدة، والحصة المؤجلة تظهر في تاريخها الجديد */
function sessionsOn(date,groups,moves){var out=[];(groups||[]).forEach(function(g){var sl=daySlots(g,date);if(!sl.length)return;out.push({g:g,date:date,start:sl[0].start||'',end:sl[sl.length-1].end||'',room:sl[0].room||'',slots:sl.length,mins:sl.reduce(function(a,x){return a+Math.max(0,mins(x.end)-mins(x.start))},0),times:sl.map(function(x){return (x.start||'')+' – '+(x.end||'')})})});
  (moves||movesList()).forEach(function(q){if(q.status!=='approved'||q.kind!=='postpone'||q.new_date!==date)return;var g=(groups||[]).filter(function(x){return x.id===q.group_id})[0];if(!g)return;var st=String(q.new_time||'').slice(0,5),du=slotDur(g,q.sess_date),en=hhmm(mins(st)+du);out.push({g:g,date:date,start:st,end:en,room:'',slots:1,mins:du,times:[st+' – '+en],moved:true,from:q.sess_date})});
  return out.sort(function(a,b){return mins(a.start)-mins(b.start)})}

function tabs(cur){

  else if(S.role==='manager')items=[['p-home',I.home,'navHome'],['requests',I.approve,'navReq',apCount()],['t-cash',I.coins,'navCash'],['t-chq',I.doc,'navCheques',S.od?chqSoon():0],['account',I.user,'navAccount']];

  else if(S.role==='board')items=[['h-home',I.home,'navHome'],['h-act',I.listI,'navActivity'],['account',I.user,'navAccount']];
  else if(S.role==='treasurer')items=[['p-home',I.home,'navHome'],['t-cash',I.coins,'navCash',S.od?rcvPend().length:0],['t-chq',I.doc,'navCheques',S.od?chqSoon():0],['account',I.user,'navAccount']];
  else if(S.role==='reception')items=[['o-docs',I.doc,'navDocRev',(S.dp||[]).length],['account',I.user,'navAccount']];

async function afterLogin(){
  S.err='';
  try{S.me=await rpc('sx_coach_me');}catch(e){S.me=null;var cc=coachCache();if(isNet(e)&&cc)S.me=cc.me}
  S.role=S.me&&S.me.role||null;
  if(S.role==='coach'){S.view='today';await loadCoach();await loadExt()}
  else if(S.role==='parent'){S.view='pa-home';await loadParent()}
  else if(isOffice()){S.view='p-home';await loadOffice()}
  else if(S.role==='branch_head'){S.view='b-home';await loadBranch()}
  else if(S.role==='board'){S.view='h-home';await loadBoard()}
  else if(S.role==='reception'){S.view='o-docs';await loadDocPend()}
  else if(S.role){S.view='account'}

  render();flush();

/* ---------- Coach ---------- */
function isNet(e){return !isOnline()||/Failed to fetch|NetworkError|network|Load failed|fetch/i.test(String(e&&e.message||e||''))}
function coachCache(){var c=load('sxm-coach');return c&&c.email===S.email?c:null}
async function cacheRosters(){var r=load('sxm-rosters')||{};for(var i=0;i<(S.groups||[]).length;i++){try{r[S.groups[i].id]=await rpc('sx_group_roster',{g:S.groups[i].id})}catch(e){if(isNet(e))return}}store('sxm-rosters',r)}
async function loadCoach(){
  try{
    S.groups=await rpc('sx_coach_groups');
    var ty=todayY();S.weekReq=await rpc('sx_coach_requests',{from_d:ty,to_d:addDays(ty,7)});
    var today=sessionsOn(ty,S.groups),info={};
    for(var i=0;i<today.length;i++){var g=today[i].g;if(info[g.id])continue;try{info[g.id]=await rpc('sx_session_get',{g:g.id,d:ty})}catch(e){}}
    S.todayInfo=info;S.err='';S.cachedAt=null;
    store('sxm-coach',{email:S.email,me:S.me,groups:S.groups,weekReq:S.weekReq,day:ty,todayInfo:info,at:Date.now()});
    cacheRosters().then(function(){if(S.view==='today')render()});
    try{S.news=await rpc('sx_news')}catch(e){}
  }catch(e){
    var c=coachCache();
    if(isNet(e)&&c){S.groups=c.groups||[];S.weekReq=c.weekReq||[];S.todayInfo=c.day===todayY()?(c.todayInfo||{}):{};S.cachedAt=c.at;S.err=''}
    else S.err=errMsg(e)
  }
}

    var roster=await rpc('sx_group_roster',{g:gid}),inf=await rpc('sx_session_get',{g:gid,d:date});

async function act17(a,el,id,v){
  if(a==='crTick'){S.cr=Object.assign({},S.cr&&S.cr.id===id?S.cr:{id:id},{agree:!(S.cr&&S.cr.id===id&&S.cr.agree)});S.formErr='';return true}
  if(a==='crNo'){S.cr={id:id,no:true,why:'',edit:S.cr&&S.cr.edit};S.formErr='';return true}
  if(a==='crBack'){S.cr=S.cr&&S.cr.edit?{id:S.cr.id,edit:true}:null;S.formErr='';return true}
  if(a==='crEdit'){S.cr={id:id,edit:true};return true}
  if(a==='crSend'){var yes=v==='yes',cr=S.cr||{};if(yes&&!(cr.id===id&&cr.agree)){S.cr=Object.assign({id:id},cr.id===id?cr:{});S.formErr=t('convTick');return true}
    S.busy=true;render();try{await rpc('sx_conv_reply',{cid:id,mid:S.childId,yes:yes,why:yes?null:(cr.why||'')});S.cr=null;S.formErr='';S.busy=false;await loadConvP();toast(yes?t('convOk'):t('convNoOk'))}catch(e){S.busy=false;toast(/too_late/.test(e.message||'')?t('convLate'):need17(e))}return true}
  if(a==='nym'){S.nym=v;S.gn=null;return true}
  if(a==='noteOpen'){var r=((S.gn&&S.gn.rows)||[]).filter(function(x){return x.member_id===id})[0]||{},n=r.note||{};S.nt={mid:id,e:n.effort||0,d:n.discipline||0,p:n.progress||0,b:n.body||''};S.formErr='';S.modal='note';return true}
  if(a==='nstar'){if(S.nt)S.nt[el.getAttribute('data-k')]=+v;return true}
  if(a==='noteSave'){var nt=S.nt;if(!nt)return true;nt.b=(nt.b||'').trim();if(!nt.e||!nt.d||!nt.p||nt.b.length<2){S.formErr=t('eNote');return true}
    S.busy=true;render();try{await rpc('sx_note_save',{g:S.gn.g,mid:nt.mid,ym_in:S.gn.ym,e:nt.e,d:nt.d,p:nt.p,b:nt.b});S.busy=false;S.modal=null;S.nt=null;S.formErr='';toast(t('tNote'));await loadGroupNotes()}catch(e){S.busy=false;S.formErr=/bad_month/.test(e.message||'')?t('eMonth'):isNet(e)?t('netErr'):need17(e)}return true}
  if(a==='csel'){S.cf.sel[id]=!S.cf.sel[id];return true}
  if(a==='cselG'){var g=(S.cc||[]).filter(function(x){return x.id===id})[0];if(g){var all=g.members.every(function(m){return S.cf.sel[m.id]});g.members.forEach(function(m){S.cf.sel[m.id]=!all})}return true}
  if(a==='convCreate'){var f=S.cf,mids=Object.keys(f.sel).filter(function(k){return f.sel[k]});

async function act18(a,el,id,v){
  if(a==='ath'){await openAth(id,S.view==='c-ath'?S.athFrom:S.view);return true}
  if(a==='athNote'){S.grp=el.getAttribute('data-g');S.gn=null;S.view='notes';render();await loadGroupNotes();var r=((S.gn&&S.gn.rows)||[]).filter(function(x){return x.member_id===id})[0]||{},n=r.note||{};S.nt={mid:id,e:n.effort||0,d:n.discipline||0,p:n.progress||0,b:n.body||''};S.formErr='';S.modal='note';return true}
  if(a==='emerg'){S.em={};S.formErr='';S.modal='emerg';return true}
  if(a==='emergGo'){S.busy=true;render();try{S.em={data:await rpc('sx_emergency_contact',{mid:S.athId})};S.busy=false}catch(e){S.busy=false;S.formErr=isNet(e)?t('netErr'):need18(e)}return true}
  if(a==='injNew'){S.inj={part:'',sev:0,acts:{},body:''};S.formErr='';S.view='c-inj';window.scrollTo(0,0);return true}
  if(a==='injPart'){S.inj.part=v;S.formErr='';return true}
  if(a==='injSev'){S.inj.sev=+v;return true}
  if(a==='injAct'){S.inj.acts[v]=!S.inj.acts[v];return true}
  if(a==='injSend'){var f=S.inj;if(!f.part){S.formErr=t('eInjPart');return true}S.busy=true;render();
    try{var r2=await rpcQueued('sx_injury_report',{mid:S.athId,part:f.part,sev:f.sev,acts:ACTS.filter(function(k){return f.acts[k]}),body:(f.body||'').trim()});S.busy=false;f.done=true;f.queued=!!(r2&&r2.queued);S.formErr=''}catch(e){S.busy=false;S.formErr=need18(e)}return true}
  if(a==='icOpen'){S.ic={id:id,note:'',cert:false};return true}
  if(a==='icNo'){S.ic=null;return true}
  if(a==='icCert'){S.ic.cert=!S.ic.cert;return true}
  if(a==='icOk'){S.busy=true;render();try{await rpc('sx_injury_close',{iid:id,note:(S.ic&&S.ic.note)||'',cert:!!(S.ic&&S.ic.cert)});S.busy=false;S.ic=null;toast(t('tDone'));await loadInj()}catch(e){S.busy=false;toast(/already_decided/.test(e.message||'')?t('eDecided'):need18(e));await loadInj()}return true}
  if(a==='fym'){var y=ymAdd(S.fym||ymNow(),+v);S.fym=y>ymNow()?ymNow():y;return true}
  if(a==='hfEdit'){var x=(S.hl||[]).filter(function(z){return z.member_id===id})[0]||{};S.hf={mid:id,note:x.note||'',edit:true};S.formErr='';window.scrollTo(0,0);return true}
  if(a==='hfDel'){try{await rpc('sx_health_set',{mid:id,note:''});toast(t('tDone'));await loadHealth()}catch(e){toast(need18(e))}return true}
  if(a==='hfSave'){var hf=S.hf||{};if(!hf.mid||String(hf.note||'').trim().length<2){S.formErr=t('eHealth');return true}S.busy=true;render();try{await rpc('sx_health_set',{mid:hf.mid,note:hf.note.trim()});S.busy=false;S.hf=null;S.formErr='';toast(t('tDone'));await loadHealth()}catch(e){S.busy=false;S.formErr=need18(e)}return true}
  return false;
}
function input18(id,val){
  if(S.inj&&id==='inj_b'){S.inj.body=val;return}
  if(S.ic&&id==='ic_n'){S.ic.note=val;return}
  if(S.hf&&id==='hf_n'){S.hf.note=val;return}
  if(S.hf&&id==='hf_m'){S.hf.mid=val}
}
